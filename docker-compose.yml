services:
  db:
    image: postgres:15-alpine
    container_name: dashboard_db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: dashboard_financeiro
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  app:
    build: .
    container_name: dashboard_app
    restart: always
    command: sh -c "python manage.py collectstatic --noinput && python manage.py migrate && gunicorn controle_financeiro.wsgi:application --bind 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
    env_file:
      - .env

volumes:
  pg_data:
